name: daon_2x2
description: "김다조이의 구구단 모험 — 8세 아동을 위한 과학적 구구단 학습 게임"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  flutter_tts: ^4.2.0

  # ── Firebase (Phase 3 기기 동기화) ──────────────────────────────────────
  # 사용 전 설정 필요:
  #   1. https://console.firebase.google.com 에서 프로젝트 생성
  #   2. Android 앱 추가 (패키지명: com.daon.daon_2x2)
  #   3. google-services.json → android/app/ 폴더에 복사
  #   4. 아래 주석 해제 후 flutter pub get
  # firebase_core: ^3.13.1
  # cloud_firestore: ^5.6.9
  # ────────────────────────────────────────────────────────────────────────

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
